<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>KnUpload browser script sample</title>
	<style type="text/css">
	body {
		max-width: 640px;
		margin: 0 auto;
		padding: 32px 16px;
		font-family: system-ui, sans-serif;
		color: #1e293b;
		background: #f8fafc;
	}

	/* Upload zone */
	#zone {
		padding: 48px 24px;
		border: 2px dashed #cbd5e1;
		border-radius: 12px;
		background: #fff;
		text-align: center;
		cursor: pointer;
		transition: border-color .2s, background-color .2s;
	}

	/* Mouse hover and keyboard focus (the zone is focusable) */
	#zone:hover,
	#zone:focus-visible {
		border-color: #94a3b8;
		outline: none;
	}

	/* Files dragged over the zone (class added by KnUpload) */
	#zone.is-dragover {
		border-color: #16a34a;
		background: #f0fdf4;
	}

	/* Upload in progress (class added by KnUpload) */
	#zone.is-uploading {
		border-style: solid;
		border-color: #16a34a;
		cursor: progress;
	}

	/* Progress bar */
	#progress {
		height: 6px;
		margin-top: 16px;
		border-radius: 3px;
		background: #e2e8f0;
		overflow: hidden;
	}

	#progress div {
		width: 0;
		height: 100%;
		background: #16a34a;
		transition: width .2s;
	}

	/* Messages */
	#message.success {
		color: #15803d;
	}

	#message.error {
		color: #b91c1c;
	}
	</style>
</head>
<body>
	<h1>KnUpload browser script</h1>

	<!-- The file input is created automatically if the zone does not contain one -->
	<div id="zone">Drop up to 3 images or PDF here, paste them or click to select them</div>
	<div id="progress"><div></div></div>
	<p id="message"></p>
	<button id="cancel" type="button">Cancel</button>
	<button id="destroy" type="button">Destroy</button>

	<script src="../node_modules/kn-http/dist/kn-http.iife.min.js"></script>
	<script src="../dist/kn-upload.iife.js"></script>
	<script>
	let myid = 547,
	zone = document.getElementById('zone'),
	progressBar = document.querySelector('#progress div'),
	message = document.getElementById('message');

	function showMessage(text, type) {
		message.textContent = text;
		message.className = type || '';
	}

	let zoneInstance = KnUpload.create(zone, {
		url: '/api/upload',
		data: () => ({
			id: myid,
			superdata: 'mysuperbdata'
		}),
		request: {
			csrf: '838da7ac74d22a0d5b25048632f6eb4ae4ec3c6c007613ecd83336f348f75aa7',
			timeout: 0
		},
		accept: ['image/*', '.pdf'],
		maxFiles: 3,
		maxFileSize: 10 * 1024 * 1024,
		maxTotalSize: 20 * 1024 * 1024,
		paste: true,
		preventDocumentDrop: true,
		onFiles: (files) => {
			console.log('onFiles()', files);
		},
		onReject: (rejections) => {
			console.log('onReject()', rejections);
			showMessage(rejections.length + ' file(s) rejected: ' + rejections.map(r => r.file.name + ' (' + r.reason + ')').join(', '), 'error');
		},
		onStart: (files) => {
			console.log('onStart()', files);
			showMessage('Uploading ' + files.length + ' file(s)...');
		},
		onProgress: (progress) => {
			progressBar.style.width = progress + '%';
		},
		onSent: () => {
			console.log('onSent()');
			showMessage('The server is processing the files...');
		},
		onSuccess: (res, files) => {
			console.log('onSuccess()', res.data, res.headers, res.status, files);
			showMessage(files.length + ' file(s) uploaded', 'success');
		},
		onError: (err, files) => {
			console.log('onError()', err.code, err.status, err.data, err.headers, files);
			if (err.code == KnHttp.NETWORK_ERROR) showMessage('Please check your internet connection', 'error');
			else showMessage('Upload error: ' + err.message, 'error');
		},
		onEnd: (report) => {
			console.log('onEnd()', report);
			if (report.canceled) showMessage('Upload canceled', 'error');
		}
	});

	document.getElementById('cancel').onclick = () => zoneInstance.cancel();
	document.getElementById('destroy').onclick = () => zoneInstance.destroy();
	</script>
</body>
</html>
